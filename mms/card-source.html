<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1080px;height:1350px;overflow:hidden;background:#fff}
.top{position:absolute;left:0;top:0;width:1080px;height:640px;background:linear-gradient(180deg,#3d6bb3 0%,#2a4d87 100%)}
.top:after{content:"";position:absolute;left:-200px;right:-200px;bottom:-230px;height:360px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.logo{position:absolute;left:50%;top:78px;transform:translateX(-50%);width:560px}
.photo{position:absolute;left:50%;top:375px;transform:translateX(-50%);width:460px;height:460px;border-radius:50%;border:14px solid #fff;box-shadow:0 18px 50px rgba(20,40,80,.28);overflow:hidden;background:#ddd}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.name{position:absolute;top:860px;width:100%;text-align:center;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:84px;color:#1d3561;letter-spacing:-1px}
.role{position:absolute;top:962px;width:100%;text-align:center;font-size:34px;font-weight:600;color:#2a4d87;letter-spacing:.5px}
.sub{position:absolute;top:1016px;width:100%;text-align:center;font-size:30px;color:#4b5a73}
.badge{position:absolute;left:50%;top:1095px;transform:translateX(-50%);display:flex;gap:0;background:#f1f5fb;border:3px solid #cfdcf0;border-radius:24px;padding:26px 48px;align-items:center}
.badge .k{font-size:22px;font-weight:600;color:#6a7a94;letter-spacing:2px;text-transform:uppercase}
.badge .v{font-size:40px;font-weight:700;color:#1d3561;margin-top:4px;font-variant-numeric:tabular-nums}
.badge .sep{width:3px;height:84px;background:#cfdcf0;margin:0 46px}
.foot{position:absolute;bottom:34px;width:100%;text-align:center;font-size:24px;color:#8a97ad}
.check{display:inline-block;width:34px;height:34px;border-radius:50%;background:#2f9e5b;vertical-align:-6px;margin-right:12px;position:relative}
.check:after{content:"";position:absolute;left:12px;top:6px;width:9px;height:17px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
</style></head><body>
<div class="card">
  <div class="top"></div>
  <img class="logo" src="logo_white.png" alt="">
  <div class="photo"><img src="head_sq.jpg" alt=""></div>
  <div class="name">Kevin Mehner</div>
  <div class="role">LICENSED LIFE &amp; HEALTH AGENT</div>
  <div class="sub"><span class="check"></span>Utah Resident Producer &middot; Serving Utah County</div>
  <div class="badge">
    <div><div class="k">Utah License</div><div class="v">#1139802</div></div>
    <div class="sep"></div>
    <div><div class="k">NPN</div><div class="v">22376845</div></div>
  </div>
</div>
</body></html>
